name: Verify toolkit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: skills/manage-job-applications/scripts/antigravity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: skills/manage-job-applications/scripts/antigravity/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
